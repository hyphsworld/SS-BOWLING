name: Build Super Strike Web

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/pop-wall-alley-gator
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run mobile gameplay diagnostic
        run: npm run diagnostics:mobile-gameplay

      - name: Verify strike and spare impact audio
        run: node scripts/impact-audio-diagnostic.js

      - name: Check connection recovery
        run: node scripts/connection-recovery-diagnostic.js

      - name: Export web build
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://yuhxtdkhsltaqiagrtys.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_oYdN-75W3b7k3m1zLukI-A_BKWVDD5e
        run: npx expo export --platform web --output-dir dist

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-strike-web
          path: frontend/dist
          if-no-files-found: error
